# Next.js on Netlify runs on the Netlify Next.js runtime (SSR, route handlers, middleware).
# Runtime secrets (DATABASE_URL, SESSION_SECRET and the BASE_*/X402_* settings) live in the
# Netlify UI with the Functions scope, not in this file. The Base keeper is a long-running
# process and runs elsewhere (see railway.base-keeper.json).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Declared explicitly so CLI/API uploads get the Next.js runtime too (Git-connected builds
# detect it automatically). Unpinned on purpose: Netlify keeps it current.
[[plugins]]
  package = "@netlify/plugin-nextjs"
