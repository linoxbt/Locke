# Next.js on Netlify uses the OpenNext adapter automatically (SSR, route handlers, middleware).
# Runtime secrets (DATABASE_URL, LOCKE_KEY_ENC, SESSION_SECRET, STRIKE_BUILDER_CODE) live in the
# Netlify UI with the Functions scope, not in this file. The risk worker is a long-running
# process and runs elsewhere (see railway.json).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
